</style></head><body><main class="shell"><header class="top"><div class="title">航向仪<span class="en">COURSE DISPLAY</span></div><span class="state" id="badge">STBY</span></header><canvas id="panel" width="760" height="520" aria-label="蓝褐色地平仪、绿色虚线航迹和下一路口箭头"></canvas><p class="read" id="message" role="status">可先试飞。到出发点后，打开定位开始骑行。</p><div class="keys"><button class="primary" id="live">开始定位</button><button id="demo">试飞</button><button id="sound" aria-pressed="false">语音关</button><button id="stop" hidden>结束</button></div><footer class="bottom"><span class="units">TRK °　/　DIST km</span><span class="credits">路网 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 贡献者</span></footer></main><script>

:"straight"},{"i":41,"turn":"right"},{"i":46,"turn":"arrive"}]}];
const locationParts=location.hash.slice(1).split(',');
const base=locationParts.map(Number);
const keyed=locationParts.length===2 && locationParts.every(p=>/^-?\d{1,3}\.\d{1,8}$/.test(p)) && Math.abs(base[0])<=180 && Math.abs(base[1])<=85;
const startPoint=keyed?base:[0,34];
const routes=layouts.map(r=>({cues:r.cues,points:r.points.map(([dx,dy])=>[startPoint[0]+dx/1e7,startPoint[1]+dy/1e7])}));
const rad=Math.PI/180,latScale=111190,origin=routes[0].points[0],lonScale=latScale*Math.cos(origin[1]*rad);

let pts,cum,cues,total;
function setRoute(route){pts=route.points.map(xy);cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));total=cum.at(-1);cues=route.cues.map(v=>({...v,s:cum[v.i]})).sort((a,b)=>a.s-b.s)}
setRoute(routes[1]);
const names={straight:'直行',right:'右转',left:'左转',slightLeft:'向左前方',slightRight:'向右前方',uturn:'掉头',arrive:'抵达'};
const glyph={straight:'↑',right:'↱',left:'↰',slightLeft:'↖',slightRight:'↗',uturn:'↶',arrive:'◎'};
function clamp(x,l,h){return Math.min(h,Math.max(l,x))}
function bearing(a,b){return (Math.atan2(b[0]-a[0],b[1]-a[1])/rad+360)%360}
function pointAt(s){let i=1;while(i<cum.length-1&&cum[i]<s)i++;let u=clamp((s-cum[i-1])/(cum[i]-cum[i-1]||1),0,1);return pts[i].map((v,j)=>pts[i-1][j]+(v-pts[i-1][j])*u)}
function nearest(p){let best={d:Infinity};for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dy=b[1]-a[1],len2=dx*dx+dy*dy;const u=clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(len2||1),0,1),d=Math.hypot(p[0]-a[0]-u*dx,p[1]-a[1]-u*dy);if(d<best.d)best={d,s:cum[i-1]+u*Math.sqrt(len2)}}return best}
function nextCue(s){return cues.find(c=>c.s>s-3)||cues.at(-1)}
function meters(d){return d>=1000?(d/1000).toFixed(1)+' km':Math.max(0,Math.round(d/5)*5)+' m'}
const $=id=>document.getElementById(id),panel=$('panel'),ctx=panel.getContext('2d');
let mode='idle',phase='idle',statusText='',s=0,position=null,heading=null,lastFix=0,anchor=null,watch=null,clock=null,voice=false,lastVoice='',coordinate=null,session=0,wake=null;
function state(tag,text){$('badge').textContent=tag;if(statusText!==text){$('message').textContent=text;statusText=text}}
function say(text,key){if(voice&&lastVoice!==key&&'speechSynthesis' in window){lastVoice=key;let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';speechSynthesis.cancel();speechSynthesis.speak(u)}}
async function keepAwake(){try{if(mode!=='live'||document.hidden||!navigator.wakeLock)return;const lock=await navigator.wakeLock.request('screen');if(mode==='live')wake=lock;else await lock.release()}catch{}}
function controls(){let active=mode!=='idle';$('demo').hidden=active;$('live').hidden=active;$('stop').hidden=!active}
function reset(){session++;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;clearInterval(clock);clock=null;if(wake)wake.release().catch(()=>{});wake=null;if('speechSynthesis' in window)speechSynthesis.cancel();mode='idle';phase='idle';heading=null;position=null;coordinate=null;lastVoice='';anchor=null;lastFix=0;s=0;controls()}
function done(){const wasDemo=mode==='demo';reset();phase='arrived';state(wasDemo?'DEMO END':'ARRIVED',wasDemo?'试飞结束。到出发点后可开始定位。':'已到达目的地附近，请找合适的位置停车。');say('已抵达', 'end');draw()}
function report(){let c=nextCue(s),d=Math.max(0,c.s-s);let label=c.turn==='arrive'?'到达目的地附近':names[c.turn]||'直行';state(mode==='demo'?'DEMO · 试飞':'GPS · 定位中',(mode==='demo'?'模拟骑行 · ':'')+meters(d)+' 后'+label);if(d<=110)say((d<22?'前方路口':Math.round(d/10)*10+'米后')+label,String(c.i)+(d<22?'-near':'-far'))}
function startDemo(){reset();setRoute(routes[1]);mode='demo';phase='tracking';controls();const t=performance.now();function tick(){s=Math.min(total,(performance.now()-t)/1000*total/65);position=pointAt(s);heading=bearing(position,pointAt(Math.min(s+5,total)));if(s>=total)return done();report();draw()}tick();clock=setInterval(tick,130)}
// A second candidate allows a phone supplying GCJ-02 to acquire the WGS84 road graph at the departure gate.
function gcjOffset(lon,lat){let x=lon-105,y=lat-35,pi=Math.PI,sin=Math.sin;
let a=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x)),b=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
let base=(20*sin(6*x*pi)+20*sin(2*x*pi))*2/3;
a+=base+(20*sin(y*pi)+40*sin(y*pi/3))*2/3+(160*sin(y*pi/12)+320*sin(y*pi/30))*2/3;
b+=base+(20*sin(x*pi)+40*sin(x*pi/3))*2/3+(150*sin(x*pi/12)+300*sin(x*pi/30))*2/3;
let w=1-.006693421622965943*Math.pow(sin(lat*rad),2),z=Math.sqrt(w);
return [b/(6378245/z*Math.cos(lat*rad)*rad),a/(6378245*(1-.006693421622965943)/(w*z)*rad)]}
function suspend(msg,label='HOLD'){heading=null;anchor=null;position=null;phase='hold';state(label,msg);draw()}
function onFix(fix){if(mode!=='live')return;const c=fix.coords;lastFix=Date.now();if(Date.now()-fix.timestamp>14000||!Number.isFinite(c.accuracy)||c.accuracy>35)return suspend('定位精度不足，航迹已暂停。请在开阔处等候。');
const raw=[c.longitude,c.latitude],off=gcjOffset(...raw),both=[xy(raw),xy(raw.map((v,i)=>v-off[i]))];
if(coordinate===null){
let best=null;
for(let j=0;j<routes.length;j++){setRoute(routes[j]);for(let k=0;k<2;k++){let m=nearest(both[k]);if(m.s> (j===0?440:475)||m.d>Math.max(38,c.accuracy+15))continue;if(!best||m.d<best.d)best={j,k,d:m.d}}}
if(!best)return suspend('到小区南侧或东侧临街辅路后，仪表会自动接上路线。','起点待定位');
setRoute(routes[best.j]);coordinate=best.k}
let p=both[coordinate],m=nearest(p);if(m.d>Math.max(38,c.accuracy+15))return suspend('已偏离预设路线。请先停车核对位置。','OFF ROUTE');

if(Number.isFinite(c.heading)&&c.heading>=0&&Number.isFinite(c.speed)&&c.speed>1){heading=c.heading;anchor=p}
else if(!anchor)anchor=p;else if(Math.hypot(p[0]-anchor[0],p[1]-anchor[1])>Math.max(7,c.accuracy*.65)){heading=bearing(anchor,p);anchor=p}
if(heading===null){phase='acquiring';state('GPS · 待定向','已定位。沿出发道路推行几步，获取前进方向。')}else{phase='tracking';report()}draw()}
function startLive(){reset();if(!keyed){state('GPS OFF','请用完整的 NFC 路线链接打开，再开始定位。');draw();return}if(!window.isSecureContext||!navigator.geolocation){state('GPS OFF','当前打开方式不支持定位。请使用 HTTPS 网页并允许定位。');draw();return}mode='live';phase='acquiring';controls();state('GPS · 等待中','正在获取手机位置，请允许定位并保持页面在前台。');keepAwake();let token=session;watch=navigator.geolocation.watchPosition(f=>{if(token===session)onFix(f)},e=>{if(token!==session)return;if(e.code===1){reset();state('GPS OFF','定位权限未开启。请允许此网页访问位置，然后重新开始。');draw()}else suspend('暂时未收到有效定位，等待手机重新定位。')},{enableHighAccuracy:true,maximumAge:0,timeout:12000});clock=setInterval(()=>{if(lastFix&&Date.now()-lastFix>15000&&phase!=='hold')suspend('定位更新中断，航迹已暂停。')},1500);draw()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='live')keepAwake()});
function line(x1,y1,x2,y2,color,w=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke()}
function txt(t,x,y,size,col='#ecf2f6',align='center',weight=550){ctx.font=weight+' '+size+'px ui-monospace, Menlo, monospace';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(t,x,y)}
function poly(points,fill,stroke,width=2){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}

function trackPath(){const angle=heading*rad;ctx.lineCap='butt';for(let d=2;d<148&&s+d<total;){let end=Math.min(d+2.3+d*.022,total-s);
function project(f){let p=pointAt(s+f),x=p[0]-position[0],y=p[1]-position[1],forward=x*Math.sin(angle)+y*Math.cos(angle),side=x*Math.cos(angle)-y*Math.sin(angle);if(forward<0)return null;return [380+side*380/(forward+10),237+167*14/(forward+14)]}
let a=project(d),b=project(end);if(a&&b)line(...a,...b,'#73fa45',clamp(105/(1+d*.12),3,48));d=end+1.7+d*.025}}
function draw(){const bounds=panel.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,3),w=Math.max(480,Math.round(Math.min(bounds.width,bounds.height*760/520)*ratio)),h=Math.round(w*520/760);if(panel.width!==w||panel.height!==h){panel.width=w;panel.height=h}ctx.setTransform(w/760,0,0,h/520,0,0);ctx.clearRect(0,0,760,520);

ctx.save();ctx.beginPath();ctx.moveTo(173,128);ctx.quadraticCurveTo(211,45,305,44);ctx.lineTo(455,44);ctx.quadraticCurveTo(548,45,587,128);ctx.lineTo(587,324);ctx.quadraticCurveTo(557,408,464,418);ctx.lineTo(296,418);ctx.quadraticCurveTo(202,407,173,324);ctx.closePath();ctx.clip();
let sky=ctx.createLinearGradient(0,39,0,238);sky.addColorStop(0,'#1457b9');sky.addColorStop(1,'#207be1');ctx.fillStyle=sky;ctx.fillRect(168,36,425,205);let earth=ctx.createLinearGradient(0,237,0,419);earth.addColorStop(0,'#964926');earth.addColorStop(1,'#602b24');ctx.fillStyle=earth;ctx.fillRect(168,237,425,184);line(168,237,595,237,'#f2eee0',3);
for(let n=-6;n<=6;n++){if(!n)continue;let y=237+n*20,half=Math.abs(n)%2?13:36;line(380-half,y,380+half,y,'#f1f5ef',2);if(Math.abs(n)===4){txt('10',315,y,16);txt('10',444,y,16)}}
if(active)trackPath();ctx.restore();
for(let a=-60;a<=60;a+=10){let r=a*rad;line(380+204*Math.sin(r),239-204*Math.cos(r),380+(a%30===0?220:212)*Math.sin(r),239-(a%30===0?220:212)*Math.cos(r),'#e6eff5',3)}
poly([[380,38],[373,51],[387,51]],null,'#ffdf53',3);poly([[380,34],[371,21],[389,21]],null,'#ffdf53',3);
for(const dir of [-1,1]){const coords=[[52,-5],[133,-5],[133,4],[64,4],[64,17],[53,17]].map(([x,y])=>[380+x*dir,237+y]);poly(coords,'#111924','#ffe25d',3)}ctx.fillStyle='#121925';ctx.fillRect(375,232,10,10);ctx.strokeStyle='#ffe25d';ctx.lineWidth=3;ctx.strokeRect(375,232,10,10);
tape(33,'NEXT',c?String(5*Math.round(d/5)):'—','m');tape(645,'DIST',active?((total-s)/1000).toFixed(2):'—','km');
txt(c?glyph[c.turn]:'—',643,26,42,c?'#7debdc':'#7a8792');txt(c?meters(d):'—',697,35,19,'#91ebe0');
ctx.save();ctx.beginPath();ctx.rect(172,438,416,69);ctx.clip();ctx.fillStyle='#182330';ctx.fillRect(168,442,424,59);
if(active){let base=Math.floor(heading/5)*5;for(let deg=base-40;deg<=base+40;deg+=5){let x=380+(deg-heading)*6.8;line(x,443,x,deg%10===0?457:450,'#d2dfe4',2);if(deg%10===0)txt(String((deg+360)%360).padStart(3,'0'),x,479,17)}}else txt('TRK  — — —',380,475,17,'#a1afbc');ctx.restore();poly([[380,452],[372,436],[388,436]],'#f9da51');}
$('demo').onclick=startDemo;$('live').onclick=startLive;$('stop').onclick=()=>{reset();state('STBY','已结束。可重新开始定位或试飞。');draw()};$('sound').onclick=()=>{if(!('speechSynthesis'in window)){state('VOICE OFF','此浏览器不支持语音，仍可查看箭头和距离。');return}voice=!voice;$('sound').setAttribute('aria-pressed',String(voice));$('sound').textContent=voice?'语音开':'语音关';if(voice)say('路口语音已开启','enabled');else speechSynthesis.cancel()};window.addEventListener('resize',draw);if(!keyed)state('STBY','可先试飞。实骑时请用 NFC 路线链接打开。');draw();
